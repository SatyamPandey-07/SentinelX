syntax = "proto3";

package com.sentinelx.proto.ai;

option java_multiple_files = true;
option java_package = "com.sentinelx.proto.ai";
option java_outer_classname = "AIServiceProto";

service AIService {
  rpc ClassifyIncident (ClassifyRequest) returns (ClassifyResponse);
  rpc CheckDuplicate (DuplicateCheckRequest) returns (DuplicateCheckResponse);
}

message ClassifyRequest {
  string incident_id = 1;
  string title = 2;
  string description = 3;
  string category_hint = 4;
  double latitude = 5;
  double longitude = 6;
}

message ClassifyResponse {
  string category = 1;
  string severity = 2;
  double confidence = 3;
  string reasoning = 4;
  repeated string recommended_actions = 5;
  bool safety_rule_applied = 6;
}

message DuplicateCheckRequest {
  string title = 1;
  string description = 2;
  string category = 3;
  double latitude = 4;
  double longitude = 5;
  int64 time_window_seconds = 6;
}

message DuplicateCheckResponse {
  bool is_potential_duplicate = 1;
  string original_incident_id = 2;
  double similarity_score = 3;
  double distance_meters = 4;
}
