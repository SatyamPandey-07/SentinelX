name: SentinelX CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================
  # Java Backend Microservices Build & Test
  # ==========================================
  build-java-services:
    name: Build & Test Java Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Run Unit Tests
        run: mvn clean test -B

      - name: Package JAR Artifacts
        run: mvn package -DskipTests -B

  # ==========================================
  # Python AI & Grounded RAG Service Test
  # ==========================================
  test-python-ai-service:
    name: Test AI & RAG Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/ai-service/requirements.txt

      - name: Run Pytest Test Suite
        run: |
          PYTHONPATH=services/ai-service pytest services/ai-service/tests

  # ==========================================
  # Next.js Tactical Frontend Build
  # ==========================================
  build-frontend:
    name: Build Next.js Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: npm ci --prefix frontend

      - name: Next.js Production Build
        run: npm run build --prefix frontend

  # ==========================================
  # Container Security Scanning (Trivy)
  # ==========================================
  container-security-scan:
    name: Container Security & Vulnerability Scan
    needs: [build-java-services, test-python-ai-service]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Local Incident Service Docker Image
        run: |
          docker build -t sentinelx/ai-service:test services/ai-service

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'sentinelx/ai-service:test'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
