version: '3.8'

services:
  # ==========================================
  # Relational Database: PostgreSQL with PostGIS
  # ==========================================
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: sentinelx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinelx_admin
      POSTGRES_PASSWORD: sentinelx_secret_password
      POSTGRES_DB: sentinelx_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelx_admin -d sentinelx_auth"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinelx-net

  # ==========================================
  # In-Memory Cache & Distributed Lock: Redis
  # ==========================================
  redis:
    image: redis:7.2-alpine
    container_name: sentinelx-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ""
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sentinelx-net

  # ==========================================
  # Event Backbone: Apache Kafka (KRaft Mode)
  # ==========================================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: sentinelx-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - sentinelx-net

  # ==========================================
  # Kafka Management UI
  # ==========================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: sentinelx-kafka-ui
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: sentinelx-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - sentinelx-net

  # ==========================================
  # Search & Duplicate Detection: OpenSearch
  # ==========================================
  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: sentinelx-opensearch
    restart: unless-stopped
    environment:
      - cluster.name=sentinelx-search-cluster
      - node.name=sentinelx-search-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - sentinelx-net

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.12.0
    container_name: sentinelx-opensearch-dashboards
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    depends_on:
      - opensearch
    networks:
      - sentinelx-net

  # ==========================================
  # Vector Database: Qdrant (RAG & Embeddings)
  # ==========================================
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: sentinelx-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinelx-net

  # ==========================================
  # Distributed Tracing: Jaeger
  # ==========================================
  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: sentinelx-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Web UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    networks:
      - sentinelx-net

  # ==========================================
  # Metrics Scraper: Prometheus
  # ==========================================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: sentinelx-prometheus
    restart: unless-stopped
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - sentinelx-net

  # ==========================================
  # Dashboards: Grafana
  # ==========================================
  grafana:
    image: grafana/grafana:10.4.0
    container_name: sentinelx-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=sentinelx
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - sentinelx-net

  # ==========================================
  # Mock Notification Ingestion: MailHog
  # ==========================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: sentinelx-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - sentinelx-net

networks:
  sentinelx-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  opensearch_data:
  qdrant_data:
  prometheus_data:
  grafana_data:
