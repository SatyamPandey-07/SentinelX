services:
  # ==========================================
  # Relational Database: PostgreSQL with PostGIS
  # ==========================================
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: sentinelx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinelx_admin
      POSTGRES_PASSWORD: sentinelx_secret_password
      POSTGRES_DB: sentinelx_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelx_admin -d sentinelx_auth"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinelx-net

  # ==========================================
  # In-Memory Cache & Distributed Lock: Redis
  # ==========================================
  redis:
    image: redis:7.2-alpine
    container_name: sentinelx-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ""
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sentinelx-net

  # ==========================================
  # Event Backbone: Apache Kafka (KRaft Mode)
  # ==========================================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: sentinelx-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - sentinelx-net

  # ==========================================
  # Kafka Management UI
  # ==========================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: sentinelx-kafka-ui
    restart: unless-stopped
    ports:
      # Was 8085, which collides with sla-service's app port once the app
      # services (added below) are brought up in the same stack.
      - "8095:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: sentinelx-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - sentinelx-net

  # ==========================================
  # Search & Duplicate Detection: OpenSearch
  # ==========================================
  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: sentinelx-opensearch
    restart: unless-stopped
    environment:
      - cluster.name=sentinelx-search-cluster
      - node.name=sentinelx-search-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - sentinelx-net

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.12.0
    container_name: sentinelx-opensearch-dashboards
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    depends_on:
      - opensearch
    networks:
      - sentinelx-net

  # ==========================================
  # Vector Database: Qdrant (RAG & Embeddings)
  # ==========================================
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: sentinelx-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': > /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinelx-net

  # ==========================================
  # Distributed Tracing: Jaeger
  # ==========================================
  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: sentinelx-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Web UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    networks:
      - sentinelx-net

  # ==========================================
  # OpenTelemetry Collector (Section 21)
  # Central ingestion point for traces from every service's OTel Java
  # agent — decouples app instrumentation from the tracing backend (batches
  # spans, could fan out to multiple backends later) rather than every
  # service hardcoding Jaeger's address directly.
  # ==========================================
  otel-collector:
    image: otel/opentelemetry-collector:0.102.1
    container_name: sentinelx-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ../observability/otel/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    depends_on:
      - jaeger
    networks:
      - sentinelx-net

  # ==========================================
  # Metrics Scraper: Prometheus
  # ==========================================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: sentinelx-prometheus
    restart: unless-stopped
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - sentinelx-net

  # ==========================================
  # Dashboards: Grafana
  # ==========================================
  grafana:
    image: grafana/grafana:10.4.0
    container_name: sentinelx-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=sentinelx
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - sentinelx-net

  # ==========================================
  # Mock Notification Ingestion: Mailpit
  # MailHog itself is unmaintained (archived upstream) and its floating
  # `:latest` tag now resolves to a broken image that fails to even start
  # ("unable to find user mailhog" — its own passwd file no longer defines
  # the user its entrypoint expects). Mailpit is the standard actively
  # maintained drop-in replacement: same SMTP (1025) + web UI (8025) ports,
  # same "capture outbound mail for local inspection" role.
  # ==========================================
  mailhog:
    image: axllent/mailpit:v1.21.3
    container_name: sentinelx-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - sentinelx-net

  # ==========================================================================
  # APPLICATION SERVICES (Section 47: `docker compose up` starts the whole
  # system, not just infra). Each builds from its own Dockerfile with the
  # repo root as build context (multi-module Maven reactor — see the
  # Dockerfiles themselves for why).
  # ==========================================================================

  auth-service:
    build:
      context: ../..
      dockerfile: services/auth-service/Dockerfile
    image: sentinelx/auth-service:latest
    container_name: sentinelx-auth-service
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: sentinelx_admin
      POSTGRES_PASSWORD: sentinelx_secret_password
      AUTH_DB_NAME: sentinelx_auth
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sentinelx-net

  incident-service:
    build:
      context: ../..
      dockerfile: services/incident-service/Dockerfile
    image: sentinelx/incident-service:latest
    container_name: sentinelx-incident-service
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: sentinelx_admin
      POSTGRES_PASSWORD: sentinelx_secret_password
      INCIDENT_DB_NAME: sentinelx_incident
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AI_SERVICE_URL: http://ai-service:8000
      SEARCH_SERVICE_URL: http://search-service:8086
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - sentinelx-net

  location-service:
    build:
      context: ../..
      dockerfile: services/location-service/Dockerfile
    image: sentinelx/location-service:latest
    container_name: sentinelx-location-service
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: sentinelx_admin
      POSTGRES_PASSWORD: sentinelx_secret_password
      LOCATION_DB_NAME: sentinelx_location
      LOCATION_GRPC_PORT: 9094
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8084:8084"
      - "9094:9094"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sentinelx-net

  assignment-service:
    build:
      context: ../..
      dockerfile: services/assignment-service/Dockerfile
    image: sentinelx/assignment-service:latest
    container_name: sentinelx-assignment-service
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LOCATION_GRPC_HOST: location-service
      LOCATION_GRPC_PORT: 9094
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8083:8083"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      location-service:
        condition: service_started
    networks:
      - sentinelx-net

  sla-service:
    build:
      context: ../..
      dockerfile: services/sla-service/Dockerfile
    image: sentinelx/sla-service:latest
    container_name: sentinelx-sla-service
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8085:8085"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - sentinelx-net

  search-service:
    build:
      context: ../..
      dockerfile: services/search-service/Dockerfile
    image: sentinelx/search-service:latest
    container_name: sentinelx-search-service
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: 9200
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8086:8086"
    depends_on:
      kafka:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    networks:
      - sentinelx-net

  realtime-service:
    build:
      context: ../..
      dockerfile: services/realtime-service/Dockerfile
    image: sentinelx/realtime-service:latest
    container_name: sentinelx-realtime-service
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8087:8087"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - sentinelx-net

  notification-service:
    build:
      context: ../..
      dockerfile: services/notification-service/Dockerfile
    image: sentinelx/notification-service:latest
    container_name: sentinelx-notification-service
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8088:8088"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - sentinelx-net

  analytics-service:
    build:
      context: ../..
      dockerfile: services/analytics-service/Dockerfile
    image: sentinelx/analytics-service:latest
    container_name: sentinelx-analytics-service
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: sentinelx_admin
      POSTGRES_PASSWORD: sentinelx_secret_password
      ANALYTICS_DB_NAME: sentinelx_analytics
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8089:8089"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - sentinelx-net

  audit-service:
    build:
      context: ../..
      dockerfile: services/audit-service/Dockerfile
    image: sentinelx/audit-service:latest
    container_name: sentinelx-audit-service
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: sentinelx_admin
      POSTGRES_PASSWORD: sentinelx_secret_password
      AUDIT_DB_NAME: sentinelx_audit
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - sentinelx-net

  ai-service:
    build:
      context: ../../services/ai-service
      dockerfile: Dockerfile
    image: sentinelx/ai-service:latest
    container_name: sentinelx-ai-service
    restart: unless-stopped
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      AI_CLASSIFIER_PROVIDER: ${AI_CLASSIFIER_PROVIDER:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - sentinelx-net

  api-gateway:
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
    image: sentinelx/api-gateway:latest
    container_name: sentinelx-api-gateway
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      AUTH_SERVICE_URL: http://auth-service:8081
      INCIDENT_SERVICE_URL: http://incident-service:8082
      LOCATION_SERVICE_URL: http://location-service:8084
      SEARCH_SERVICE_URL: http://search-service:8086
      ANALYTICS_SERVICE_URL: http://analytics-service:8089
      AUDIT_SERVICE_URL: http://audit-service:8090
      AI_SERVICE_URL: http://ai-service:8000
      REALTIME_SERVICE_URL: http://realtime-service:8087
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      incident-service:
        condition: service_started
    networks:
      - sentinelx-net

networks:
  sentinelx-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  opensearch_data:
  qdrant_data:
  prometheus_data:
  grafana_data:
