apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sentinelx-dev

resources:
  - ../../base/namespace.yaml
  - ../../base/configmap.yaml
  - ../../base/incident-service-deployment.yaml
  - ../../base/api-gateway-deployment.yaml
  - ../../base/ingress.yaml
  - ../../base/hpa.yaml

patches:
  - target:
      kind: Deployment
      name: incident-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
